<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 삼각형 그리기</title>
    <script type="text/javascript">
        window.onload = function () {
            const canvas = document.getElementById('canvas');
            if (canvas.getContext) {
                const context = canvas.getContext('2d');

                // 삼각형 그리기
                context.beginPath(); // 새로운 경로 시작
                context.moveTo(50, 50);  // 시작점
                context.lineTo(150, 50); // 위쪽 직선
                context.lineTo(100, 150); // 아래쪽으로 선
                context.closePath(); // 경로 닫기

                // 내부 색상 지정
                context.fillStyle = 'rgba(0,0,255,0.5)'; // 반투명 파란색
                context.fill(); // 내부 색칠

                // 테두리 색상 지정 및 선 두께 설정
                context.strokeStyle = 'rgb(200,0,0)'; // 빨간색 테두리
                context.lineWidth = 3;
                context.stroke(); // 경로 테두리 그리기

            } else {
                alert('브라우저가 캔버스를 지원하지 않습니다.');
            }
        };
    </script>
</head>
<body>
    <h2>Canvas 삼각형 예제</h2>
    <canvas id="canvas" width="200" height="200" style="border:1px solid black;"></canvas>
</body>
</html>
