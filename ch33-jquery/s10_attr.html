<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query</title>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript">
        // jQuery 사용: 문서가 로드되면 실행
        $(function() {
            // attr() : 속성과 관련된 모든 기능을 수행
            // 하나의 속성 제어
            // $('img').attr('width',100);

            // 복수의 속성 제어

            /*
            $('img').attr('width',150);
            $('img').attr('height',150);
            */

            // 복수의 속성 제어(객체 활용)
            $('img').attr({width:200,height:200});
         
        });
    </script>
</head>
<body>
  <img src ="../files/blue.jpg">
  <img src ="../files/flower.jpg">
  <img src ="../files/winter.jpg">
</body>
</html>
