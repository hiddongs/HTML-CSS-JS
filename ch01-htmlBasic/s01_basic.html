
<!DOCTYPE html> <!--  DOCTYPE : 현재 문서의 유형을 저으이  -->
<html lang="ko ">   <!-- 한글로 설정한다는 뜻  -->
<!-- 속성 속성값  -->
<!-- lang 속성은 웹 브라우저 동작에는 영향을 주지 않고 구글 같은 검색 엔진이 웹 페이지를 탐색할 때 해당당 웹 페이지를 어떤 
      언어로 작성했는지 쉽게 알 수 있도록 도와줌. -->
<head>
<!--
    meta : 웹 브라우저와 관련된 정보 지정
    charset : 문자셋 지정정



-->
    <meta charset="UTF-8">  <!-- 보통 한글이 깨지는 경우가 있어서서 이걸로 설정 (인코딩) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- 모바일에서도 볼 수 있게 환경설정  -->
    <title>첫 번째 페이지</title>
</head>
<body>
<!--HTML : Hypertext Markup Language
           웹 문서를 만들 때 사용하는 태그 중심의 언어
    HTML 문서 작성시 주의사항
    1) 대소문자를 구분하지 않는다.
       <body>, <BODY>는 모두 같은 의미. 그러나, 일반적으로는 소문자로 표시.
    2) 2칸 이상의 공백은 모두 1칸으로 취급한다
    3) 줄바꿈하기 위해서는 <br> 태그를 명시해야 함 
-->
Hello      World!!

오늘은 금요일 ! ! ! 
<br>
내일은 토요일 ! ! !
</body>
</html>
