<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 핸들들</title>
    <style type="text/css">
        div{
            margin:5px;
            padding:3px;
            border-width:3px;
            border-style: solid;
            border-color:black;
            border-radius:10px;
        }
        
    </style>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript">
        $(document).on('click', 'h1', function() {
            let length = $('h1').length; // 현재 h1 태그 개수
            let targetHTML = $(this).html(); // 클릭된 h1의 내용 가져오기
            $('#wrap').append('<h1>' + length + '-' + targetHTML + '</h1>');
        });
    </script>
</head>
<body>   
    <div id="wrap">
        <h1>Header</h1>
    </div>
</body>
</html>
