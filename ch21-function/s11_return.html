<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>return</title>
</head>
<body>
    <script type="text/javascript">
        // 함수 정의
        function returnTest(){
            document.write('문장 A<br>');

            for(let i = 1; i <= 10; i++){

                // 조건문
                if(i == 5){
                    // break; 반목문 탈출
                    return; // 처음 함수로 돌아감
                }
                // i 값 출력
                document.write9i +'<br>';
            }

            document.write('문장 B<br>');
        }
    </script>
    
</body>
</html>
