<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>paserInt(),parseFloat()</title>
</head>
<body>
    <script type="text/javascript">

      let num = '1234';
      let won = '1000원';
      let won2 ='원1000';

      // string -> number
      document.write(Number(num) + '<br>');

      //NaN
      document.write(Number(won) + '<br>');
       

      let num2 = '24.56';
      let dollar = '1.5$';
      let dollar2 ='$1.5';

      document.write(Number(num2)+'<br>');
      document.write(Number(dollar)+'<br>');

      document.write(parseFloat(num2)+'<br>');
      document.write(parseFloat(dollar)+'<br>');
      document.write(parseFloat(dollar2)+'<br>');

      document.write('--------------------<br>');

      let no1 = '10';
      let no2 = '3.67';

      // 3, 소수점 이하 자리 절삭삭
      document.write(parseInt(no2) + '<br>');
      document.write(parseFloat(no1)); // 10

    </script>
</body>
</html>
