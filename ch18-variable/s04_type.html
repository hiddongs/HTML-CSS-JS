<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script type ="text/javascript">

        // 변수 선언 및 초기화
        var numberVar = 273;
        var stringVar ='서울';
        var booleanVar = true;

        var functionVar = function(){}; // 함수수
        var objectVar = {}; // 객체

        var arrayVar = []; // 배열

        var nullVar = null;

        var undefinedVar = undefined; 

        //typeof 변수명 : 해당 변수에 저장된 데이터의 타입을 알아내는 연산자
        document.write(
            'numberVar: ' + typeof numberVar + '<br>');
        
        document.write(
            'stringVar : ' + typeof stringVar + '<br>');
        document.write(
            'booleanVar : ' + typeof booleanVar + '<br>');
        document.write(
            'functionVar : ' + typeof funtionVar + '<br>');

        document.write(
            'objectVar : ' + typeof objectVar + '<br>');
        document.write(
            'arraytVar : ' + typeof arrayVar + '<br>');
        document.write(
            'nullVar : ' + typeof nullVar + '<br>')
        
        document.write(
                'undefinedVar : ' + typeof undefinedVar + '<br>')
    </script>
</body>
</html>
