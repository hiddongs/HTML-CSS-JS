<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type ="text/javascript">
        /*
        [실습] 국어, 영어, 수학 성적(0 ~ 100) 입력 받아서 총점, 평균 구함
        [입력에시] promt 사용 - 국어 입력, 영어 입력, 수학 입력
        [출력예시]

        국어 : 99
        영어 : 98
        수학 :97
        총점 : 294
        평균 : 98

        */
        var korInput = prompt('국어 점수를 입력하세요','숫자');
        var engInput = prompt('영어 점수를 입력하세요','숫자');
        var matInput = prompt('수학 점수를 입력하세요','숫자');

        var tot = korInput + engInput + matInput;
        var avr = (korInput + engInput + matInput) / 3;

        document.write('국어 = ' +korInput  + '<br>');
        document.write('영어 = ' + engInput + '<br>');
        document.write('수학 = ' + matInput + '<br>');
        document.write('총점 = ' + tot + '<br>'); 
        document.write('평균 = ' +avr + '<br>');
    </script>
    
</body>
</html>
