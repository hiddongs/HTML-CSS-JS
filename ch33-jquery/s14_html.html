<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query</title>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript">
        // jQuery 사용: 문서가 로드되면 실행
        $(function() {
         
           // html 태그 적용
           $('div').html('<h1>오늘은 목요일</h1>');
           // html 태그 미적용
           $('p').text('<h1>내일은 금요일</h1>');
           
           $('h1').html(function(index){
            return 'Header - ' + index;
           });

           $('h2').html(function(index){
            return 'Header - ' + index;
           });

           $('h2').html(function(index,html){
            // index : 배열의 인덱스
            // html : 해당 태그의 내부의 데이터
            return '**' + html + '**';
           });
        });
    </script>
</head>
<body>   
    <div></div>
    <p></p>

    <hr width="100%" size ="1" noshade="noshade">

    <h1></h1>
    <h1></h1>
    <h1></h1>

    <hr width="100%" size ="1" noshade="noshade">

    <h2>Header - 0</h2>
    <h2>Header - 1</h2>
    <h2>Header - 2</h2>
   


</body>
</html>
