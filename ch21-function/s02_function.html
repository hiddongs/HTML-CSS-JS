<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수수</title>
</head>
<body>
    <script type ="text/javascript">

        // 함수의 이름이 같을 경우 마지막 함수 출력

        function 함수(){
            document.write('함수 A<br>');
        }

        //함수 호출
        함수();


        function 함수 (){
            document.write('함수 B<br>');
        }

        함수();

        document.write('------------------<br>');

        함수();

        function 함수2(){
            document.write('함수2<br>');
        }

        함수();

        document.write('------------------<br>');

        함수();

        // 익명 함수로 함수를 정의하면 함수 호이스팅이 발생
        // 하는 것이 아니라 변수 호이스팅 발생
        // 익명 함수 이전에 함수를 참조하면 undefined로 평가
        var 함수4 = function(){
            document.write('함수4');
        }
    </script>
    
</body>
</html>
