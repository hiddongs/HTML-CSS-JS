<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>white-space</title>
    <style type="text/css">

        /* 공백 줄바꿈 인정(디바이스이 넓이를 줄여도 글자가 다음 라인으로 이동 X) */
        #t1{white-space: pre;}
        
        /* 공백 불인정 줄바꿈 인정(디바이스의 넓이를 줄이면 자연스럽게 글자가 다음 라인 이동)*/
        #t2{white-space: pre-line;}


        /* 공백 줄바꿈 인정(디바이스의 넓이를 줄이면 자연스럽게 글자가 다음 라인으로 이동 */
        #t3{white-space: pre-wrap;}


        /* 공백 줄바꿈 불인정(디바이스의 넓이와 관계없이 줄바꿈 불인정) */
        #t4{white-space: nowrap;}
    </style>
</head>
<body>

    <h1>white-space</h1>
    <p id="t1">

        예를 들어                 다음 그림처럼                스마트폰 고정.
        예를 들어 다음 그림처럼 스마트폰 고정.  예를 들어 다음 그림처럼 스마트폰 고정.
    </p>
    <p id="t2">
        예를 들어                 다음 그림처럼                스마트폰 고정.
        예를 들어 다음 그림처럼 스마트폰 고정.  예를 들어 다음 그림처럼 스마트폰 고정.
    </p>
    <p id="t3">
        예를 들어                 다음 그림처럼                스마트폰 고정.
        예를 들어 다음 그림처럼 스마트폰 고정.  예를 들어 다음 그림처럼 스마트폰 고정.
    </p>
    <p id="t4">
        예를 들어                 다음 그림처럼                스마트폰 고정.
        예를 들어 다음 그림처럼 스마트폰 고정.  예를 들어 다음 그림처럼 스마트폰 고정.
    </p>
    
</body>
</html>
