<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내부 함수수</title>
</head>
<body>
    <script type="text/javascript">

        function f(){
            // 변수 선언 및 초기화
            let n = 123;
            // 내부 함수 정의
            function g(){
                document.write('n is ' + n + '<br>');
                document.write('g is called');
            }

            return g; // 내부 함수 반환
        }

        // 함수 호출
        let m = f();
        document.write(m + '<br>');
        document.write('--------------<br>');

    </script>
</body>
</html>
