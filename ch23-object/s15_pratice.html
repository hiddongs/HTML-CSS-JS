<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">

        /*
        [문제]
        은행 계좌(Account) 생성
        속성 > 계좌번호, 예금주, 잔고
        메서드 > 입금(deposite), 출금(withdraw)
                 출력(toString => 계좌번호, 예금주, 잔고)
        
             1) 계좌 생성
             2) 잔고 확인
             3) 입금
             4) 잔고 확인
             5) 출금
             6) 잔고 확인
        */

        let number = prompt('계좌번호','');
        let name = prompt('예금주','');
        let balance = prompt('잔액','');
        
        const myBank = new Bank(number,name,Number(balance));

        while(true){
            let menu = prompt('메뉴>1.입금, 2.출금 3. 잔고 확인, 4. 종료');

            if(menu === '1'){
                 myBank.deposite(Number(prompt('입금액','')));
            }
            else if(menu === '2'){
                 myBank.widthraw(Number(prompt('차감액','')));
            }
            else if(menu === '3'){

                alert(myBank);
                
            }
            else if(menu === '4'){

                document.write('프로그램을 종료합니다.');
                
            }
            else{
                alert('잘못 입력했습니다.');
            }
        }

       function Bank(number, name, balance){
           this.number = number;
           this.name = name;
           this.balance = balance;

           this.deposite = function(money){
            this.balance += money;

            toString();
           }
           this.widthraw = function(money){
            this.balance -= money;
            toString();

           }
           this.toString = function(){
            return this.number +', ' + this.name + this.balance;
           }
           
       }
        
    </script>
</body>
</html>
