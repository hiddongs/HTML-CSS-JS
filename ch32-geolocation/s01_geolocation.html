<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/JavaScript">
        window.onload=function(){
            if(!navigator.geolocation){
                alert('본 기기가 위치 정보를 지원하지 않습니다.');
                return;
            }
            /*
            사용자의 현재 기기의 위치를 positon 오브젝트 형으로 반환
            형식 getCurrnetPosition(successCallback, errorCallback, options)
            [옵션]
            frequency : 위치 정보를 가져올 시간 간격으로 단위는 밀리세컨드(ms),

            enableHighAccuracy : 위치 정보의 정확성을 최상으로 할지 여부 지정

            timeout : 기기로부터 위치 정보를 가져올 때 최대 대기 시간. 단위는 밀리세컨드(ms)

            maxNumAge : 위치 정보를 캐싱하는 기간을 지정.
                        단위는 밀리세컨드(ms)
            
            */
           navigator.geolocation.getCurrentPosition(success,fail, {timeout:10000});

           // 위도, 경도값 호출이 가능한 경우
           function success(position){ // 현재 위치 값 
            /*

            latitude : 위도
            longitude : 경도
            altitude : 고도
            accuracy : 위도와 경도의 정확도
            
            altitudeAccuracy : 고도의 정확도
            heading : 방향(북쪽으로부터 시계방향으로 현재 방향까지의 각도)

            speed : 현재 기기의 속도를 meter per second
            */

            document.getElementById('startLat')
                .innerHTML = position.coords.latitude;
            document.getElementById('startLon')
                .innerHTML = position.coords.longitude;

           }
           function fail(error) {

            alert('에러 발생 코드 : ' + error.code)
           }
           /*

           0 : 알 수 없는 오류
           1 : 권한 거부
           2 : 위치 추적 실패
           3 : 시간 초과과

           */
        }

        // 현재 위치 계속 확인
        // watchPosition : 일정 간격으로 기기의 위치가 바뀌면 현재 기기의 위치를 
        // position 객체 형으로 변환

        const watchId =
              navigator.geolocation.watchPosition(function(position){
                let lat = position.coords.latitude;
                let lon = position.coords.longtitude;

                // 위치 정보의 오차. meter로 표시시
                let acc = position.coords.accuracy;
                document.getElementId('currentLat').innerHTML = lat;
                document.getElementId('currentLon').innerHTML = lon;

              });

        const btn = document.getElementById('btn');
        btn.addEventListener('click',function(){
            // clearWatch : watchPosition 메서드로 위치 추적
            // 를 하는 것을 해제하는 역할
            navigator.geolocation.clearWatch(watchId);
            alert('위치 추적이 해제됨');
        },false);

        // 
    </script>
</head>
<body>
    시작 위치 (위도, 경도) : <br>
    <span id="startLat">위도</span>&deg;
    <span id="startLon">경도</span>&deg;
    <br><br>
    현재 위치 (위치, 경도) : <br>
    <span id="currentLat">위도</span>&deg;
    <span id="currentLon">경도</span>&deg;
    <br><br>
    정확도 : <br>
    <span id="acc">정확도</span>미터 정도의 정확도를 보임
    <br><br>
    <button id="btn">위치 추적 해제</button>
</body>
</html>
