<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">

        var a = 20, b = '20', result;

         // 값만 비교
        result = a == b; 
        document.write('a == b : ' + result + '<br>');

        
        result = a === b; // 값과 타입 둘 다 비교교
        document.write('a == b : ' + result + '<br>');

        result = a != b; // 값만 비교
        document.write('a != b : ' + result + '<br>');

        result = a !== b; // 값과 타입 둘 다 비교교
        document.write('a != b : ' + result + '<br>');

    </script>
    
</body>
</html>
