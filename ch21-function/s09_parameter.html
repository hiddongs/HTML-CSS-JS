<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type ="text/javascript">

/*
ES6에 새롭게 추가된 나머지 매개변수는 매개변수를 정의할 때 정해지지 않은 매개변수들을 정의할 수 있게 함
arguments 객체와 유사한 arguments 객체는 함수에 전달되는 모든 전달 인자를 포함하는 반면에, 
나머지 매개변수는 정해지지 않은 나머지를 의미함.
*/

    function test1(...args){
        for(let i = 0; i <args.length; i++)

         
        document.write(
        'arguments['+i+'] : ' + args[i] + '<br>');
        
}

function test2 (a,b,...others){
    document.write('a : ' + a + '<br>');
    document.write('b : ' + b + '<br>');

    for(let i = 0; i < others.length; i++){
        document.write(
            'others['+i+'] : ' + others[i]+'<br>');
        
    }
}

test2(10,20,30,40);
        
    </script>
    
</body>
</html>
