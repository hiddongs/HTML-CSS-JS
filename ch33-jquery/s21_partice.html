<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서 객체 생성</title>
    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript">
      
        $(function() {
      
            /*

              [문제] 도서 정보를 table에 표시 region
                    도서명       분류       정상가격        할인가격(5%) 
                    자바         IT         20,000원       19,000원
                    미술사       예술       30,000원       28,500원
                    노래 연습    예술       10,000원        9,500원 
                    한국사       역사       50,000원        47,000원원


            */

            


             // 배열 생성
             const content = [
                {book:'자바', class:'IT', price:20000},
                {book:'미술사', class:'예술',price:30000},
                {book:'노래 연습', class:'예술',price:10000},
                {book:'한국사', class:'역사',price:50000}
            ];
            

            let output = `
                <tr>
                    <th>도서명</th>
                    <th>분류</th>
                    <th>정상가격</th>
                    <th>할인가격(5%)</th>
                </tr>
            `;
            $(content).each(function(index,item){
                //   index : 배열의 인덱스
                // item : 배열의 인덱스 통해 호출됨 객체
                let discountPrice = item.price - (item.price * 0.05); // 5% 할인 적용
                output += `
                    <tr>
                        <td>${item.book}</td>
                        <td>${item.class}</td>
                        <td>${item.price.toLocaleString()}원</td>
                        <td>${discountPrice.toLocaleString()}원</td>
                    </tr>
                `;
            })

            $('#output').append(output);
     


        });

    </script>
</head>
<body>   
    <table id="output" border="1" cellspacing="0" cellpadding="10"></table>

</body>
</html>
