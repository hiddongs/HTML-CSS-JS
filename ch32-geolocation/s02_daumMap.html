<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 지도</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3f6ef5a48e1a36c997565a8c01d8e64f"></script>
    <style>
        #map {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>

    <h2>📍 내 위치 표시 (카카오 지도)</h2>
    <div id="map"></div>

    <script>
        // 페이지 로드 후 실행
        window.onload = function() {
            if (!navigator.geolocation) {
                alert('본 기기가 위치정보를 지원하지 않습니다');
                return;
            }

            // 사용자의 현재 위치 가져오기
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;  // 위도
                let lon = position.coords.longitude; // 경도
                console.log("위도:", lat, "경도:", lon);

                // 지도 생성 함수 호출
                getMap(lat, lon);
            }, function(error) {
                console.error("위치 정보를 가져올 수 없습니다.", error);
            });
        };

        function getMap(lat, lon) {
            // 지도 표시할 div
            var mapContainer = document.getElementById('map');
            
            var mapOption = {
                center: new kakao.maps.LatLng(lat, lon), // 지도 중심 좌표
                level: 3 // 확대 레벨
            };

            // 지도 생성
            var map = new kakao.maps.Map(mapContainer, mapOption);

            // 마커 생성
            var marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(lat, lon),
                map: map,
                clickable: true // 마커 클릭 가능하도록 설정
            });

            // 정보 창 (인포윈도우) 내용 설정
            var iwContent = `
                <div style="padding:10px; width:200px;">
                    📍 현재 위치<br>
                    위도: ${lat}<br>
                    경도: ${lon}<br>
                    나 여기 있어요! 🏠
                </div>
            `;

            // 정보 창 생성
            var infowindow = new kakao.maps.InfoWindow({
                content: iwContent,
                removable: true // 닫기 버튼 포함
            });

            // 마커 클릭 시 정보 창 열기
            kakao.maps.event.addListener(marker, 'click', function() {
                infowindow.open(map, marker);
            });
        }
    </script>

</body>
</html>
