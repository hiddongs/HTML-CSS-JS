<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오버워치 2</title>
    <style>
        @font-face {
            font-family: 'OverWatch';
            src: url('../files/OVERWATCH.ttf') format('truetype');
        }

        @font-face {
            font-family: 'KoverWatch';
            src: url('../files/koverwatch.ttf') format('truetype');
        }

        /* 🚀 기본 스타일 */
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            background-color: black;
            color: white;
            scroll-behavior: smooth; /* 부드러운 스크롤 */
        }

        /* 🎬 비디오 배경 */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .video-background {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* 🛠 네비게이션 바 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            padding: 15px 0;
            z-index: 1000;
            transition: background-color 0.3s ease-in-out;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 20px;
            padding: 10px 15px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: rgba(255, 165, 0, 0.7);
            border-radius: 5px;
        }

        /* 스크롤 시 네비게이션 바 스타일 변경 */
        .scrolled {
            background-color: rgba(0, 0, 0, 0.95);
        }

        /* 📝 메인 타이틀 */
        .main-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .font1 {
            font-family: "OverWatch", serif;
            font-size: 70px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .font2 {
            font-family: "KoverWatch", serif;
            font-size: 30px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* 🎮 플레이 버튼 */
        .playButton {
            background-color: orange;
            color: white;
            font-size: 18px;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            opacity: 0.9;
            transition: 0.3s;
        }

        .playButton:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        /* 📌 컨텐츠 섹션 */
        .section {
            padding: 100px 10%;
            text-align: center;
        }

        .section:nth-child(even) {
            background-color: #222;
        }

        /* 햄버거 메뉴 버튼 */
        .hamburger {
            display: none;
            font-size: 30px;
            color: white;
            cursor: pointer;
            padding: 10px;
        }

        /* 📱 반응형 디자인 */
        @media screen and (max-width: 768px) {
            .font1 {
                font-size: 50px;
            }

            .font2 {
                font-size: 24px;
            }

            .navbar {
                flex-direction: column;
                padding: 10px 0;
            }

            .navbar a {
                display: none;
                padding: 10px;
                text-align: center;
            }

            .navbar.active a {
                display: block;
            }

            .hamburger {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- 🎬 비디오 배경 -->
    <div class="video-container">
        <video class="video-background" autoplay muted loop>
            <source src="../files/youtube_ELPl0d3SXCE_1920x1080_h264.mp4" type="video/mp4">
            브라우저가 비디오 태그를 지원하지 않습니다.
        </video>

        <!-- 📝 메인 콘텐츠 -->
        <div class="main-content">
            <h1 class="font1">OverWatch 2</h1>
            <h2 class="font2">쟁취할 가치가 있는 미래</h2>
            <button class="playButton" onclick="showPopup()">지금 플레이</button>
        </div>
    </div>

    <!-- 🛠 네비게이션 바 -->
    <div class="navbar">
        <span class="hamburger" onclick="toggleMenu()">☰</span>
        <a href="#game-info">게임 정보</a>
        <a href="#hero">영웅</a>
        <a href="#season">시즌</a>
        <a href="#contact">문의</a>
    </div>

    <!-- 📌 섹션 -->
    <div id="game-info" class="section">
        <h2>게임 정보</h2>
        <p>오버워치 2는 전투를 통해 전략을 극대화하고 협동을 필요로 하는 팀 기반 액션 게임입니다.</p>
    </div>

    <div id="hero" class="section">
        <h2>영웅 소개</h2>
        <p>시간을 넘나드는 자유의 전사, 비트를 연주하는 전장의 DJ 등 30명 이상의 개성 넘치는 영웅이 기다리고 있습니다.</p>
    </div>

    <div id="season" class="section">
        <h2>최신 시즌 정보</h2>
        <p>새로운 맵, 신규 스킨, 그리고 배틀패스 보상을 확인하세요.</p>
    </div>

    <div id="contact" class="section">
        <h2>문의하기</h2>
        <p>게임 관련 문의 사항이 있다면 언제든지 연락 주세요.</p>
    </div>

    <!-- 🚀 JavaScript 추가 -->
    <script>
        // 🎮 "지금 플레이" 버튼 클릭 시 팝업 알림
        function showPopup() {
            alert("게임이 곧 출시됩니다! 준비하세요!");
        }

        // 📌 네비게이션 바 스크롤 시 배경 변경
        window.addEventListener("scroll", function () {
            let navbar = document.querySelector(".navbar");
            if (window.scrollY > 50) {
                navbar.classList.add("scrolled");
            } else {
                navbar.classList.remove("scrolled");
            }
        });

        // 📱 햄버거 메뉴 클릭 시 토글
        function toggleMenu() {
            let navbar = document.querySelector(".navbar");
            navbar.classList.toggle("active");
        }
    </script>

</body>
</html>
